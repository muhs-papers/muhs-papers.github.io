name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "styles.css"
      - "data.js"
      - "app.js"
      - "manifest.json"
      - "icon*"
      - "subject-icons.svg"
      - "sw.js"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        run: |
          SDK_MGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDK_MGR" --licenses >/dev/null || true
          "$SDK_MGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npm run build:web

      - name: Generate Android project & set app icon
        run: |
          npx cap add android
          node -e '
            const fs = require("fs");
            const path = require("path");
            const resDir = "android/app/src/main/res";
            for (const dir of fs.readdirSync(resDir)) {
              if (!dir.startsWith("mipmap-")) continue;
              const full = path.join(resDir, dir);
              for (const f of ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]) {
                const target = path.join(full, f);
                if (fs.existsSync(target)) fs.copyFileSync("icon-512.png", target);
              }
            }
            const bg = path.join(resDir, "values/ic_launcher_background.xml");
            if (fs.existsSync(bg)) {
              fs.writeFileSync(bg, "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n  <color name=\"ic_launcher_background\">#103c4b</color>\n</resources>\n");
            }
          '

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MUHS-Papers.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MUHS-Papers-APK
          path: MUHS-Papers.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "apk-latest" >/dev/null 2>&1; then
            gh release upload "apk-latest" MUHS-Papers.apk --clobber
          else
            gh release create "apk-latest" MUHS-Papers.apk --title "MUHS Papers Android APK" --notes "Latest Android APK built from main."
          fi
